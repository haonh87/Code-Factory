# Project-level instincts for Code-Factory
# Behavioral trigger-action patterns learned from sessions.
# Format: id, trigger, action, domain, source, added

instincts:
  - id: chmod-after-copyfile
    trigger: "using fs.copyFileSync for runtime or config files in sync scripts"
    action: "always chmodSync dest to 0o644 after copy — source policy files may be read-only and copyFileSync preserves permissions"
    domain: code-style
    source: bug-fix
    added: "2026-06-07"

  - id: parse-wfc-status-json
    trigger: "parsing output from wfc status --json"
    action: "wfc status --json outputs a summary line followed by a JSON block — extract only lines starting with '{' before parsing"
    domain: debugging
    source: bug-fix
    added: "2026-06-07"

  - id: find-project-root-from-hooks
    trigger: "determining project root from scripts/hooks/ directory"
    action: "cd dirname upward in a loop searching for workflow-bundle.manifest.json or package.json — do NOT use cd .. from script dir, it resolves to scripts/ not project root"
    domain: debugging
    source: bug-fix
    added: "2026-06-07"

  - id: temp-file-for-json-in-hooks
    trigger: "processing JSON in shell hook scripts with inline node"
    action: "write stdin to a temp file first, then read with fs.readFileSync — shell variable substitution breaks on special characters and empty strings"
    domain: code-style
    source: bug-fix
    added: "2026-06-07"

  - id: smoke-test-version-bump
    trigger: "bumping bundleVersion in manifest"
    action: "use `npm run bump-version -- <ver>`; it updates 11 files including both manifests, package.json, README, .claude/CLAUDE.md, docs version refs, and creates a release-note stub. Do NOT hand-edit version strings. run-workflow-bundle-smoke.js reads bundleVersion dynamically from the manifest and needs no assertion change"
    domain: release
    source: bug-fix
    added: "2026-06-07"
    revised: "2026-08-14"
    revision_note: "Original action said the smoke test hardcodes the version string. Verified false at line 103 of run-workflow-bundle-smoke.js: `readJson(...).bundleVersion`. Following the old instinct would send someone hunting for an assertion that does not exist"

  - id: chmod-before-install
    trigger: "running `wfc install` when a previous install already exists"
    action: "chmod -R u+w on ~/.claude/policies ~/.codex/policies ~/.claude/skills ~/.codex/skills first. Installed files land at 0444, so copyFileSync on the second install fails with EACCES on the first read-only destination"
    domain: release
    source: bug-fix
    added: "2026-08-14"
    note: "Sibling of chmod-after-copyfile, seen from the destination side. Hit while installing v2.3.2; the failure names one file, so it reads like a corrupt file rather than a systemic permission issue"